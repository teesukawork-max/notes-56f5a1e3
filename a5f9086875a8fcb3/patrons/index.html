<title>Patron Book</title>
<style>
:root{--bg:#0f0c10;--card:#1c1820;--card2:#241f29;--field:#141116;--line:#3a3240;--line2:#4a4150;--gold:#d8b46a;--gold2:#f1d89c;--goldd:#9c7f45;--text:#f2ece0;--muted:#b9ae9b;--dim:#8d8476;--red:#ec7b70;--redbg:rgba(236,123,112,.12);--green:#86cfa2;--blue:#9dbde6;--r:16px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","PingFang SC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif}
body{background:radial-gradient(900px 500px at 50% -180px,#2b2030 0%,rgba(15,12,16,0) 70%),var(--bg);min-height:100vh;min-height:100dvh}
body.modal-open{overflow:hidden}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.serif,.brand,h1,h2,.sec-t,.modal-h h3{font-family:"Didot","Bodoni 72","Playfair Display",Georgia,"Times New Roman","Songti TC",serif}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.ic.sm{width:16px;height:16px;vertical-align:-3px}
/* header */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:rgba(15,12,16,.97);border-bottom:1px solid rgba(216,180,106,.22)}
.brand{font-size:21px;letter-spacing:.08em;color:var(--gold2);white-space:nowrap}
.brand .dia{color:var(--gold);font-size:14px;margin-right:6px;vertical-align:2px}
.brand-sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.sp{flex:1}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--gold2);border-radius:12px;min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;gap:6px}
.icon-btn:hover{border-color:var(--gold)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(20,16,22,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid rgba(216,180,106,.22);padding:6px 6px calc(6px + var(--safe-b))}
nav.tabs a,nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim);text-decoration:none;font-size:11px;letter-spacing:.04em;padding:6px 0;background:none;border:0;cursor:pointer}
nav.tabs .on{color:var(--gold2)}
nav.tabs .ic{width:23px;height:23px}
nav.tabs .add .ic{background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--goldd));color:#1b1408;border-radius:50%;padding:5px;width:34px;height:34px;margin-top:-6px;stroke-width:2.4;box-shadow:0 4px 14px rgba(216,180,106,.35)}
main{max-width:1120px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
.banner{background:linear-gradient(90deg,rgba(216,180,106,.18),rgba(216,180,106,.08));border-bottom:1px solid rgba(216,180,106,.3);color:var(--gold2);padding:9px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.banner button{background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
@media (min-width:880px){
  nav.tabs{position:static;justify-content:center;gap:6px;background:transparent;border:0;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs a,nav.tabs button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:8px 14px;border-radius:999px}
  nav.tabs .on{background:rgba(216,180,106,.12)}
  nav.tabs .add .ic{width:22px;height:22px;padding:3px;margin:0}
  header.top{gap:18px;background:rgba(15,12,16,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  main{padding:22px 24px 60px}
}
/* layout */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}
@media (min-width:880px){.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}.span2{grid-column:span 2}}
.card{background:linear-gradient(180deg,#201b24,#19161c);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card.hl{border-color:rgba(216,180,106,.55);box-shadow:0 0 0 1px rgba(216,180,106,.12),0 10px 30px rgba(0,0,0,.35)}
.sec-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:17px;font-weight:600;color:var(--gold2);letter-spacing:.02em}
.sec-t .ic{color:var(--gold)}
.sec-t .cnt{font-family:-apple-system,system-ui,sans-serif;font-size:12px;font-weight:600;background:rgba(216,180,106,.16);color:var(--gold2);border-radius:999px;padding:1px 8px}
.sec-t .right{margin-left:auto}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.tiny{font-size:12px}
.empty-li{color:var(--dim);font-size:13.5px;padding:6px 2px}
h1{font-size:26px;margin:4px 0 2px;font-weight:600;color:var(--text);letter-spacing:.01em}
.hello{margin:2px 2px 14px}
.hello .date{color:var(--dim);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
/* stats tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (max-width:599px){.tiles .tile:last-child:nth-child(odd){grid-column:span 2}}
@media (min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:880px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{background:linear-gradient(160deg,#261f2a,#1a161d);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:default}
.tile .v{font-size:21px;font-weight:600;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .l{font-size:11.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.tile.alert .v{color:var(--red)}
/* rows */
.prow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-top:1px solid rgba(255,255,255,.05);cursor:pointer;border-radius:10px}
.prow:first-child{border-top:0}
.prow:hover,.prow:focus-visible{background:rgba(216,180,106,.06);outline:none}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#1b1408;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,var(--goldd))}
.av.big{width:62px;height:62px;font-size:23px}
.pm{flex:1;min-width:0}
.pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .cn{font-weight:400;color:var(--muted);margin-left:4px}
.ps{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.pr{text-align:right;font-size:13px;color:var(--muted);flex:none;max-width:45%}
.pr .big{font-size:15px;color:var(--gold2);font-weight:600;font-variant-numeric:tabular-nums}
.tier{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--gold2)}
.t-dia{border-color:#a9d4f5;color:#cfe8fb;background:rgba(169,212,245,.1)}
.t-blk{border-color:var(--gold);color:var(--gold2);background:#000}
.t-plat{border-color:#d5d5de;color:#ececf2;background:rgba(213,213,222,.08)}
.t-gold{border-color:var(--gold);color:var(--gold2);background:rgba(216,180,106,.12)}
.t-vip{border-color:#c49ae0;color:#e3c9f5;background:rgba(196,154,224,.1)}
.t-mass{border-color:#86c7c0;color:#bfe7e2;background:rgba(134,199,192,.08)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted)}
.exb{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:5px;background:#5a4a24;color:#ffe6a8;vertical-align:2px;margin-left:4px}
.due{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px}
.due.over{background:var(--redbg);color:var(--red)}
.due.today{background:rgba(216,180,106,.18);color:var(--gold2)}
.due.soon{background:rgba(157,189,230,.12);color:var(--blue)}
.pill{font-size:12px;padding:1px 8px;border-radius:999px;background:rgba(134,207,162,.12);color:var(--green);font-weight:600}
.pill.out{background:rgba(216,180,106,.16);color:var(--gold2)}
.pill.up{background:rgba(157,189,230,.12);color:var(--blue)}
.pill.past{background:rgba(255,255,255,.06);color:var(--dim)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--goldd));color:#1b1408;text-decoration:none;min-height:44px;letter-spacing:.01em}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ghost:hover{border-color:var(--gold)}
.btn.danger{background:#7a2e28;color:#ffe3df}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}
.btn.xs{padding:4px 10px;min-height:30px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:rgba(216,180,106,.18);color:var(--gold2)}
.linkbtn{background:none;border:0;color:var(--gold2);cursor:pointer;text-decoration:underline;padding:4px}
/* forms */
label{display:block;font-size:12.5px;color:var(--muted);letter-spacing:.02em;margin-bottom:10px}
label.inline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],input[type=password],input:not([type]),select,textarea{display:block;width:100%;margin-top:4px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;color:var(--text);min-height:44px;outline:none}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,180,106,.15)}

<script>

const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addMonths=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dstr(d)};
const diffDays=(a,b)=>{const A=a.split('-').map(Number),B=b.split('-').map(Number);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/864e5)};
const fmtD=(s,withYear)=>{if(!isDate(s))return '';const [y,m,d]=s.split('-').map(Number);const showY=withYear||(y!==new Date().getFullYear()&&y!==0);return `${d} ${MON[m-1]}${showY&&y?' '+y:''}`};

/* money */

const toMOP=(v,c)=>(+v||0)*(c==='HKD'?rate():1);
const dispCur=()=>(S.meta&&S.meta.settings.dispCur)==='HKD'?'HKD':'MOP';
const fromMOP=v=>dispCur()==='HKD'?v/rate():v;
const fmtNum=(v,dec=0)=>Number(v).toLocaleString('en-US',{maximumFractionDigits:dec,minimumFractionDigits:0});
const compact=v=>{const a=Math.abs(v),s=v<0?'−':'';const f=(x,u)=>s+(x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2)).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1')+u;
  if(a>=1e9)return f(a/1e9,'B');if(a>=1e6)return f(a/1e6,'M');if(a>=1e4)return f(a/1e3,'K');return s+fmtNum(Math.round(a))};
const money=(vMOP,full)=>{const v=fromMOP(vMOP);return dispCur()+' '+(full?(v<0?'−':'')+fmtNum(Math.round(Math.abs(v))):compact(v))};
const moneyIn=(v,c,full)=>`${c} ${full?(v<0?'−':'')+fmtNum(Math.abs(v),2):compact(v)}`;
const pct=r=>r==null||!isFinite(r)?'—':(r*100).toFixed(r<0.1?2:1)+'%';
function parseAmt(s){if(s==null)return null;if(typeof s==='number')return isFinite(s)?s:NaN;
  s=String(s).trim().replace(/[,\s_]/g,'').replace(/[−–—]/g,'-').replace(/^(MOP|HKD|HK\$|\$|MOP\$)/i,'').replace(/[萬万]$/,'w').toLowerCase();

  root.appendChild(w);document.body.classList.add('modal-open');

    const btn=f.querySelector('button[type=submit],button:not([type])');if(btn)btn.disabled=true;
    try{const r=await opts.onSubmit(f,w);if(typeof r==='string'){if(errEl)errEl.textContent=r;return}if(r!==false)closeModal(w)}

/* ============ Crypto & storage ============ */
const TE=new TextEncoder(),TD=new TextDecoder();
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function sha256hex(s){const h=await crypto.subtle.digest('SHA-256',TE.encode(s));return Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('')}
async function deriveKey(pin,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptStr(key,salt,iter,plain){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode(AAD)},key,TE.encode(plain));
  return JSON.stringify({v:1,alg:'AES-GCM-256',kdf:'PBKDF2-SHA256',iter,salt:b64e(salt),iv:b64e(iv),ct:b64e(new Uint8Array(ct))})}
async function decryptBlob(key,blob){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv),additionalData:TE.encode(AAD)},key,b64d(blob.ct));return TD.decode(pt)}
function parseBlob(raw){const b=JSON.parse(raw);if(!b||b.v!==1||!b.salt||!b.iv||!b.ct||!(b.iter>=1000))throw new Error('Encrypted data is damaged or in an unknown format.');return b}

function defaultMeta(){return {v:1,settings:{hkdRate:1.03,dispCur:'MOP',defCur:'MOP',autoLock:5},pin:null,fail:{n:0,until:0},lastBackup:''}}
function loadMeta(){let m=null;try{m=JSON.parse(localStorage.getItem(K.meta)||'null')}catch(e){m=null}
  const d=defaultMeta();if(!m||typeof m!=='object')m=d;
  m.settings=Object.assign(d.settings,m.settings||{});m.fail=Object.assign({n:0,until:0},m.fail||{});
  if(m.pin&&!['lock','encrypt'].includes(m.pin.mode))m.pin=null;
  // Safety: ciphertext present but no plaintext and no PIN meta -> treat as encrypted (never discard ciphertext)
  if(!m.pin&&localStorage.getItem(K.enc)&&!localStorage.getItem(K.data))m.pin={mode:'encrypt'};
  return m}
function saveMeta(){try{localStorage.setItem(K.meta,JSON.stringify(S.meta))}catch(e){toast('Could not save settings: '+e.message,true)}}
function emptyData(){return {v:1,patrons:[]}}
function parseData(raw){const o=JSON.parse(raw);const arr=Array.isArray(o)?o:(o&&Array.isArray(o.patrons)?o.patrons:null);if(!arr)throw new Error('No patrons array found.');return {v:1,patrons:arr.map(normPatron)}}
function loadPlain(){const raw=localStorage.getItem(K.data);if(!raw)return emptyData();
  try{return parseData(raw)}catch(e){const k=K.data+'.corrupt-'+Date.now();try{localStorage.setItem(k,raw)}catch(_){}
    setTimeout(()=>toast('Stored data could not be read; a copy was kept under '+k,true),300);return emptyData()}}
function cleanupStorage(){const mode=S.meta.pin&&S.meta.pin.mode;
  if(mode==='encrypt'){if(localStorage.getItem(K.enc))localStorage.removeItem(K.data)}
  else if(localStorage.getItem(K.data))localStorage.removeItem(K.enc)}

let saveChain=Promise.resolve();
async function writeData(json){
  if(S.meta.pin&&S.meta.pin.mode==='encrypt'){if(!S.key||!S.encInfo)throw new Error('App is locked');
    localStorage.setItem(K.enc,await encryptStr(S.key,S.encInfo.salt,S.encInfo.iter,json))}
  else localStorage.setItem(K.data,json)}
function persist(){if(!S.data)return saveChain;const json=JSON.stringify(S.data);S.pending++;
  saveChain=saveChain.then(()=>writeData(json)).catch(e=>{const q=e&&(e.name==='QuotaExceededError'||e.code===22);toast(q?'Storage is full — export a backup and remove old records.':'Save failed: '+(e&&e.message||e),true)}).finally(()=>{S.pending--});
  return saveChain}

/* ============ Normalisation ============ */
const str=(v,max=500)=>(typeof v==='string'?v:(v==null?'':String(v))).slice(0,max);
const numOrNull=v=>{if(v==null||v==='')return null;const n=parseAmt(v);return Number.isFinite(n)?n:null};

function normComp(c){c=c||{};return {id:str(c.id,40)||uid(),type:COMP_LABEL[c.type]?c.type:'other',value:numOrNull(c.value)||0,cur:curOf(c.cur),date:dateOf(c.date),note:str(c.note,500)}}

function normPatron(p){p=p&&typeof p==='object'?p:{};const pr=p.prefs||{};
  const phones=(Array.isArray(p.phones)?p.phones:(p.phone?[p.phone]:[])).map(x=>str(x,40).trim()).filter(Boolean).slice(0,8);
  const tags=[...new Set((Array.isArray(p.tags)?p.tags:String(p.tags||'').split(',')).map(t=>str(t,40).trim()).filter(Boolean))].slice(0,30);

  return {id:str(p.id,40)||uid(),name:str(p.name,160).trim()||'(Unnamed)',cname:str(p.cname,80).trim(),nickname:str(p.nickname,80).trim(),phones,
    whatsapp:str(p.whatsapp,40).trim(),wechat:str(p.wechat,80).trim(),email:str(p.email,160).trim(),tier:str(p.tier,40).trim(),birthday:bd,
    prefs:{room:str(pr.room,200),bed:str(pr.bed,60),smoking:str(pr.smoking,40),food:str(pr.food,1000),games:str(pr.games,300),other:str(pr.other,2000)},
    notes:str(p.notes,20000),tags,followUp:dateOf(p.followUp),followUpNote:str(p.followUpNote,500),example:!!p.example,
    created:+p.created||Date.now(),updated:+p.updated||Date.now(),
    visits:arrOf(p.visits).map(normVisit).slice(0,5000),stays:arrOf(p.stays).map(normStay).slice(0,5000),contacts:arrOf(p.contacts).map(normContact).slice(0,5000)}}

/* ============ Stats ============ */
const memo=new Map();
function stats(p){let r=memo.get(p);if(r)return r;const t=today(),y12=addDays(t,-365),ym=t.slice(0,7),yy=t.slice(0,4);
  r={rollAll:0,roll12:0,rollM:0,rollY:0,compAll:0,comp12:0,compM:0,compY:0,wlAll:0,wl12:0,hasWl:false,visits:p.visits.length,stays:p.stays.length,lastSeen:'',lastVisit:''};
  for(const v of p.visits){const R=toMOP(v.rolling,v.cur),W=toMOP(v.winloss,v.cur);if(v.winloss!=null)r.hasWl=true;
    r.rollAll+=R;r.wlAll+=W;if(v.date>=y12&&v.date<=t){r.roll12+=R;r.wl12+=W}if(v.date.slice(0,7)===ym)r.rollM+=R;if(v.date.slice(0,4)===yy)r.rollY+=R;
    for(const c of v.comps){const d=c.date||v.date,C=toMOP(c.value,c.cur);r.compAll+=C;if(d>=y12&&d<=t)r.comp12+=C;if(d.slice(0,7)===ym)r.compM+=C;if(d.slice(0,4)===yy)r.compY+=C}
    if(v.date<=t){const e=v.endDate&&v.endDate<t?v.endDate:(v.endDate?t:v.date);if(e>r.lastSeen)r.lastSeen=e;if(v.date>r.lastVisit)r.lastVisit=v.date}}
  for(const s of p.stays){if(s.checkIn<=t){const e=s.checkOut<t?s.checkOut:t;if(e>r.lastSeen)r.lastSeen=e}}
  r.ratioAll=r.rollAll>0?r.compAll/r.rollAll:null;r.ratio12=r.roll12>0?r.comp12/r.roll12:null;
  memo.set(p,r);return r}
const inHouseStay=(s,t)=>s.checkIn<=t&&s.checkOut>=t;
function followState(p){if(!p.followUp)return null;const d=diffDays(today(),p.followUp);return {d,cls:d<0?'over':d===0?'today':'soon',label:d<0?`Overdue ${-d}d`:d===0?'Due today':d===1?'Tomorrow':`In ${d}d`}}

function tierBadge(t){if(!t)return '';const k=t.toLowerCase();let c='';if(k.includes('diamond'))c='t-dia';else if(k.includes('black'))c='t-blk';else if(k.includes('plat'))c='t-plat';else if(k.includes('gold'))c='t-gold';else if(k.includes('vip'))c='t-vip';else if(k.includes('mass'))c='t-mass';return `<span class="tier ${c}">${esc(t)}</span>`}

function backupReminder(){if(!S.data.patrons.some(p=>!p.example))return '';const lb=S.meta.lastBackup;const n=lb?diffDays(lb,today()):null;

function allTags(){const s=new Set();for(const p of S.data.patrons)p.tags.forEach(t=>s.add(t));return [...s].sort((a,b)=>a.localeCompare(b))}
function allTiers(){const s=new Set(TIERS);for(const p of S.data.patrons)if(p.tier)s.add(p.tier);return [...s]}
function vPatrons(){if(!S.data.patrons.length)return emptyState();const L=S.list;const opt=(v,l,cur)=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`;
  return `<div class="toolbar"><div class="search">${I('search')}<input id="q" type="search" placeholder="Search name, phone, tag, notes…" value="${esc(L.q)}" autocomplete="off" aria-label="Search patrons"></div>

    <select id="fRoll" aria-label="Rolling filter">${[['','Any rolling (12m)'],['1e5','12m ≥ 100K'],['1e6','12m ≥ 1M'],['5e6','12m ≥ 5M'],['1e7','12m ≥ 10M'],['5e7','12m ≥ 50M'],['none','No rolling 12m']].map(o=>opt(o[0],o[1],L.minRoll)).join('')}</select>

   </div></div><div class="count" id="plCount"></div><div class="card" style="padding:4px 10px"><div id="plist"></div></div>`}
function searchText(p){return [p.name,p.cname,p.nickname,p.tier,p.email,p.wechat,p.whatsapp,...p.phones,...p.tags,p.notes,p.followUpNote,p.prefs.room,p.prefs.bed,p.prefs.smoking,p.prefs.food,p.prefs.games,p.prefs.other,
  ...p.visits.map(v=>v.notes+' '+v.comps.map(c=>c.note).join(' ')),...p.stays.map(s=>s.property+' '+s.roomNo+' '+s.roomType+' '+s.comp),...p.contacts.map(c=>c.note)].join('\n').toLowerCase()}
function filteredPatrons(){const L=S.list,q=L.q.trim().toLowerCase(),qd=q.replace(/[^\d]/g,'');const t=today();
  const terms=q.split(/\s+/).filter(Boolean);
  let arr=S.data.patrons.filter(p=>{if(L.tier&&p.tier!==L.tier)return false;if(L.tag&&!p.tags.includes(L.tag))return false;
    if(L.minRoll){const r=stats(p).roll12;if(L.minRoll==='none'){if(r>0)return false}else if(fromMOP(r)<+L.minRoll)return false}
    if(terms.length){const txt=searchText(p);const ok=terms.every(w=>txt.includes(w.replace(/^#/,'')));
      if(!ok){if(qd.length>=3&&p.phones.concat(p.whatsapp).some(n=>n.replace(/[^\d]/g,'').includes(qd)))return true;return false}}
    return true});
  const tr=x=>{const i=TIERS.indexOf(x.tier);return i<0?-1:i};
  const sorters={name:(a,b)=>a.name.localeCompare(b.name),
    recent:(a,b)=>(stats(b).lastSeen||'').localeCompare(stats(a).lastSeen||'')||a.name.localeCompare(b.name),
    follow:(a,b)=>(a.followUp||'9999').localeCompare(b.followUp||'9999')||a.name.localeCompare(b.name),
    roll12:(a,b)=>stats(b).roll12-stats(a).roll12||a.name.localeCompare(b.name),
    rollAll:(a,b)=>stats(b).rollAll-stats(a).rollAll||a.name.localeCompare(b.name),
    tier:(a,b)=>tr(b)-tr(a)||a.name.localeCompare(b.name)};
  return arr.sort(sorters[L.sort]||sorters.recent)}
function renderList(){const el=$('#plist');if(!el)return;const arr=filteredPatrons(),L=S.list,t=today();
  $('#plCount').innerHTML=`<span>${plural(arr.length,'patron')}${arr.length!==S.data.patrons.length?` of ${S.data.patrons.length}`:''}</span>${(L.q||L.tier||L.tag||L.minRoll)?'<button type="button" class="linkbtn tiny" data-act="clearFilters">Clear filters</button>':''}`;

    return pRow(p,right,sub)}).join('')||'<div class="empty-li" style="padding:18px 4px">No patrons match.</div>'}

function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}

  download(`patron-book-backup-${today()}.json`,JSON.stringify(out,null,1),'application/json');S.meta.lastBackup=today();saveMeta();toast('Backup downloaded — keep it private');render()}
const csvCell=v=>{if(v==null)return '';if(typeof v==='number')return isFinite(v)?String(Math.round(v*100)/100):'';let s=String(v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCsv=rows=>'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function exportCsv(){const h=['ID','Name','Chinese name','Nickname','Tier','Tags','Phones','WhatsApp','WeChat','Email','Birthday','Room pref','Bed','Smoking','Food & drinks','Games','Other prefs','Notes','Next follow-up','Follow-up note','Last seen','Visits','Stays','Contacts','Rolling 12m (MOP)','Rolling all-time (MOP)','Comps 12m (MOP)','Comps all-time (MOP)','Comp/rolling 12m %','Comp/rolling all-time %','Win/loss 12m (MOP)','Win/loss all-time (MOP)','Example'];
  const rows=[h,...S.data.patrons.map(p=>{const s=stats(p),r=p.prefs;const pc=x=>x==null?'':Math.round(x*10000)/100;
    return [p.id,p.name,p.cname,p.nickname,p.tier,p.tags.join('; '),p.phones.join('; '),p.whatsapp,p.wechat,p.email,p.birthday.replace(/^0000/,'----'),r.room,r.bed,r.smoking,r.food,r.games,r.other,p.notes,p.followUp,p.followUpNote,s.lastSeen,s.visits,s.stays,p.contacts.length,s.roll12,s.rollAll,s.comp12,s.compAll,pc(s.ratio12),pc(s.ratioAll),s.wl12,s.wlAll,p.example?'yes':'']})];
  download(`patron-book-patrons-${today()}.csv`,toCsv(rows),'text/csv;charset=utf-8');toast('Patrons CSV downloaded')}
function exportActCsv(){const rows=[['Patron ID','Patron','Type','Date','End date','Property','Room','Rolling','Win/loss','Currency','Rolling (MOP)','Comp type','Comp value','Comp currency','Comp (MOP)','Channel','Notes']];
  for(const p of S.data.patrons){for(const v of p.visits){rows.push([p.id,p.name,'visit',v.date,v.endDate,'','',v.rolling,v.winloss,v.cur,toMOP(v.rolling,v.cur),'','','','','',v.notes]);
      for(const c of v.comps)rows.push([p.id,p.name,'comp',c.date||v.date,'','','','','','','',COMP_LABEL[c.type],c.value,c.cur,toMOP(c.value,c.cur),'',c.note])}
    for(const s of p.stays)rows.push([p.id,p.name,'stay',s.checkIn,s.checkOut,s.property,[s.roomType,s.roomNo].filter(Boolean).join(' #'),'','','','','','','','','',s.comp]);
    for(const c of p.contacts)rows.push([p.id,p.name,'contact',c.date,'','','','','','','','','','','',c.channel,c.note])}
  rows.splice(1,rows.length,...rows.slice(1).sort((a,b)=>b[3].localeCompare(a[3])));
  download(`patron-book-activity-${today()}.csv`,toCsv(rows),'text/csv;charset=utf-8');toast('Activity CSV downloaded')}
async function importFile(file){if(!file)return;if(file.size>25e6){toast('File too large',true);return}
  let data;try{data=parseData(await file.text())}catch(e){toast('Not a valid Patron Book backup: '+e.message,true);return}
  const n=data.patrons.length;const existing=new Map(S.data.patrons.map(p=>[p.id,p]));const dup=data.patrons.filter(p=>existing.has(p.id)).length;
  const w=openModal('Import backup',`<form novalidate><p>The file contains <b>${n}</b> patron${n===1?'':'s'}${dup?` (${dup} already exist here)`:''}.</p>
   <p class="small muted"><b>Merge</b> adds new patrons and updates existing ones if the file’s copy is newer. <b>Replace</b> deletes everything currently stored and uses the file.</p>
   <div class="ferr"></div><div class="actions"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="button" class="btn ghost" id="impReplace">Replace all</button><button type="submit" class="btn" id="impMerge">Merge</button></div></form>`,
   {onSubmit:()=>{let add=0,upd=0;for(const p of data.patrons){const e=existing.get(p.id);if(!e){S.data.patrons.push(p);add++}else if(p.updated>e.updated){Object.assign(e,p);upd++}}
     persist();toast(`Imported: ${add} added, ${upd} updated`);render()}});
  w.querySelector('#impReplace').addEventListener('click',async()=>{closeModal(w);if(!await confirmDlg(`Replace all <b>${S.data.patrons.length}</b> current patrons with the <b>${n}</b> from the file? This cannot be undone.`,{ok:'Replace'}))return;
    S.data.patrons=data.patrons;persist();toast(`Replaced with ${n} patrons`);render()})}

/* ============ PIN / lock ============ */
const pinOk=p=>/^\d{4,6}$/.test(p);
async function verifyPin(pin){const m=S.meta.pin;if(!m)return true;
  if(m.mode==='lock')return (await sha256hex(m.salt+':'+pin))===m.hash;
  const raw=localStorage.getItem(K.enc);if(!raw)return false;const b=parseBlob(raw);const key=await deriveKey(pin,b64d(b.salt),b.iter);try{await decryptBlob(key,b);return true}catch(e){return false}}
async function applyPin(pin,encrypt){await saveChain;const json=JSON.stringify(S.data);
  if(!pin){localStorage.setItem(K.data,json);S.meta.pin=null;saveMeta();localStorage.removeItem(K.enc);S.key=null;S.encInfo=null;return}
  if(encrypt){const salt=crypto.getRandomValues(new Uint8Array(16));const key=await deriveKey(pin,salt,PBKDF2_ITER);
    const blob=await encryptStr(key,salt,PBKDF2_ITER,json);
    // verify round-trip with an independently derived key before committing
    const check=await decryptBlob(await deriveKey(pin,salt,PBKDF2_ITER),parseBlob(blob));if(check!==json)throw new Error('Encryption self-check failed; nothing was changed.');
    localStorage.setItem(K.enc,blob);S.meta.pin={mode:'encrypt'};saveMeta();localStorage.removeItem(K.data);S.key=key;S.encInfo={salt,iter:PBKDF2_ITER}}
  else{const saltA=crypto.getRandomValues(new Uint8Array(16));const salt=b64e(saltA);const hash=await sha256hex(salt+':'+pin);
    localStorage.setItem(K.data,json);S.meta.pin={mode:'lock',salt,hash};saveMeta();localStorage.removeItem(K.enc);S.key=null;S.encInfo=null}}
function pinFields(cur){return `${cur?'<label>Current PIN<input name="cur" type="password" inputmode="numeric" maxlength="6" autocomplete="off" autofocus></label>':''}
  <div class="row2"><label>New PIN (4–6 digits)<input name="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="off" ${cur?'':'autofocus'}></label><label>Confirm new PIN<input name="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label></div>
  <label class="inline"><input type="checkbox" name="enc" ${!S.meta.pin||S.meta.pin.mode==='encrypt'?'checked':''}> Encrypt stored data with this PIN (AES-GCM)</label>
  <p class="hint">Without encryption the PIN is only a privacy screen (SHA-256 hash). With encryption, forgetting the PIN means the data is gone — export a backup first.</p>`}
function openSetPin(change){openModal(change?'Change PIN':'Set PIN',`<form novalidate autocomplete="off">${pinFields(change)}<div class="ferr"></div><div class="actions"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="submit" class="btn" id="savePin">Save PIN</button></div></form>`,
  {onSubmit:async f=>{if(change&&!(await verifyPin(f.elements.cur.value)))return 'Current PIN is incorrect.';const p1=f.elements.p1.value,p2=f.elements.p2.value;
    if(!pinOk(p1))return 'PIN must be 4–6 digits.';if(p1!==p2)return 'PINs do not match.';
    await applyPin(p1,f.elements.enc.checked);toast(f.elements.enc.checked?'PIN set · data encrypted':'PIN set');render()}})}
function openRemovePin(){openModal('Remove PIN',`<form novalidate autocomplete="off"><p>Data will be stored unencrypted and the app will open without a PIN.</p><label>Current PIN<input name="cur" type="password" inputmode="numeric" maxlength="6" autofocus autocomplete="off"></label><div class="ferr"></div><div class="actions"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button type="submit" class="btn danger">Remove PIN</button></div></form>`,
  {onSubmit:async f=>{if(!(await verifyPin(f.elements.cur.value)))return 'PIN is incorrect.';await applyPin(null);toast('PIN removed');render()}})}
function showLock(msg){S.unlocked=false;$('#app').classList.add('hide');$('#lock').classList.remove('hide');$('#pinInput').value='';$('#lockErr').textContent=msg||'';
  $('#lockMsg').textContent=S.meta.pin&&S.meta.pin.mode==='encrypt'?'Enter PIN to decrypt your patron book':'Enter your PIN to unlock';
  if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>$('#pinInput').focus(),50);updateThrottle()}
let throttleTimer=null;
function updateThrottle(){clearInterval(throttleTimer);const tick=()=>{const left=Math.ceil((S.meta.fail.until-Date.now())/1000);const b=$('#unlockBtn');
  if(left>0){b.disabled=true;$('#lockErr').textContent=`Too many attempts. Try again in ${left}s.`}else{b.disabled=false;clearInterval(throttleTimer);if(/Too many/.test($('#lockErr').textContent))$('#lockErr').textContent=''}};tick();if(S.meta.fail.until>Date.now())throttleTimer=setInterval(tick,1000)}
let unlocking=false;
async function tryUnlock(){if(unlocking)return;const pin=$('#pinInput').value;const errEl=$('#lockErr');
  if(S.meta.fail.until>Date.now())return;if(!pinOk(pin)){errEl.textContent='PIN is 4–6 digits.';return}
  if(!HAS_SUBTLE){errEl.textContent='Secure crypto unavailable in this context.';return}
  unlocking=true;$('#unlockBtn').disabled=true;errEl.textContent=S.meta.pin.mode==='encrypt'?'Decrypting…':'';
  try{const m=S.meta.pin;let data=null;
    if(m.mode==='lock'){if((await sha256hex(m.salt+':'+pin))===m.hash)data=loadPlain()}
    else{const raw=localStorage.getItem(K.enc);if(!raw)throw new Error('Encrypted data not found in this browser.');const b=parseBlob(raw);const salt=b64d(b.salt);const key=await deriveKey(pin,salt,b.iter);
      let json=null;try{json=await decryptBlob(key,b)}catch(e){json=null}
      if(json!=null){data=parseData(json);S.key=key;S.encInfo={salt,iter:b.iter}}}
    if(!data){const f=S.meta.fail;f.n++;if(f.n>=5)f.until=Date.now()+Math.min(15*60e3,30e3*Math.pow(2,f.n-5));saveMeta();
      errEl.textContent=`Incorrect PIN${f.n>=3&&f.n<5?` · ${5-f.n} tries before a timeout`:''}`;const c=$('.lock-card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('#pinInput').value='';updateThrottle();return}
    S.meta.fail={n:0,until:0};saveMeta();S.data=data;cleanupStorage();startApp()}
  catch(e){errEl.textContent=e.message||String(e)}
  finally{unlocking=false;if(S.meta.fail.until<=Date.now())$('#unlockBtn').disabled=false}}
async function lockNow(){if(!S.meta.pin)return;closeAllModals();await saveChain;S.data=null;S.key=null;S.encInfo=null;memo.clear();$('#main').innerHTML='';showLock()}

/* ============ Router / render ============ */
function route(){const h=location.hash||'#/';if(h.startsWith('#/p/'))return {v:'detail',id:decodeURIComponent(h.slice(4))};if(h==='#/patrons')return {v:'patrons'};if(h==='#/settings')return {v:'settings'};return {v:'dash'}}
function render(){if(!S.unlocked||!S.data)return;memo.clear();const r=route();let html;
  if(r.v==='detail'){const p=findP(r.id);html=p?vDetail(p):`<div class="card empty"><h2>Patron not found</h2><a class="btn" href="#/patrons">Back to patrons</a></div>`}
  else if(r.v==='patrons')html=vPatrons();else if(r.v==='settings')html=vSettings();else html=vDashboard();
  $('#main').innerHTML=html;if(r.v==='patrons')renderList();
  $$('#tabs [data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===(r.v==='detail'?'patrons':r.v)));
  $('#exBanner').classList.toggle('hide',!S.data.patrons.some(p=>p.example));$('#lockBtn').classList.toggle('hide',!S.meta.pin);
  document.documentElement.style.setProperty('--hh',$('header.top').offsetHeight+'px')}
function startApp(){S.unlocked=true;S.lastActivity=Date.now();$('#lock').classList.add('hide');$('#app').classList.remove('hide');render()}
window.addEventListener('hashchange',()=>{closeAllModals();render();window.scrollTo(0,0)});
window.addEventListener('resize',()=>{const h=$('header.top');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')});

/* ============ Actions ============ */
const pById=el=>findP(el.dataset.id);
const subOf=(p,arr,el)=>p&&p[arr].find(x=>x.id===el.dataset.sub);
const ACT={
 closeModal:el=>closeModal(el.closest('.modal-wrap')),
 open:el=>{location.hash='#/p/'+el.dataset.id},
 newPatron:()=>{closeAllModals();openPatronForm()},
 editPatron:el=>openPatronForm(pById(el)),
 quickAdd:()=>openQuickAdd(),
 qaVisit:el=>{closeAllModals();const p=pById(el);location.hash='#/p/'+p.id;setTimeout(()=>openVisitForm(p),0)},
 qaStay:el=>{closeAllModals();const p=pById(el);location.hash='#/p/'+p.id;setTimeout(()=>openStayForm(p),0)},
 qaContact:el=>{closeAllModals();openContacted(pById(el))},
 addVisit:el=>openVisitForm(pById(el)),addStay:el=>openStayForm(pById(el)),
 editVisit:el=>{const p=pById(el);openVisitForm(p,subOf(p,'visits',el))},
 editStay:el=>{const p=pById(el);openStayForm(p,subOf(p,'stays',el))},
 editContact:el=>{const p=pById(el);openContacted(p,subOf(p,'contacts',el))},
 delVisit:el=>delSub(el,'visits','this visit (and its comps)'),delStay:el=>delSub(el,'stays','this hotel stay'),delContact:el=>delSub(el,'contacts','this contact log'),
 contacted:el=>openContacted(pById(el)),setFollow:el=>openSetFollow(pById(el)),
 deletePatron:async el=>{const p=pById(el);if(!p)return;if(!await confirmDlg(`Delete <b>${esc(p.name)}</b> and all ${p.visits.length} visits, ${p.stays.length} stays? This cannot be undone.`,{ok:'Delete patron'}))return;
   S.data.patrons=S.data.patrons.filter(x=>x!==p);persist();toast('Patron deleted');location.hash='#/patrons'},
 addComp:el=>{const f=el.closest('form');$('#comps',f).insertAdjacentHTML('beforeend',compRow(null,S.meta.settings.defCur,f.elements.date.value||today()));const rows=$$('.comp-row',f);rows[rows.length-1].querySelector('[name=cval]').focus()},
 rmComp:el=>el.closest('.comp-row').remove(),
 nights:el=>{const f=el.closest('form');const ci=f.elements.checkIn.value;if(isDate(ci))f.elements.checkOut.value=addDays(ci,+el.dataset.n)},
 chip:el=>{const f=el.closest('form');const inp=f.elements[el.dataset.t];const v=el.dataset.v;
   if(el.dataset.mode==='date'){const map={'+3 days':()=>addDays(today(),3),'+1 week':()=>addDays(today(),7),'+2 weeks':()=>addDays(today(),14),'+1 month':()=>addMonths(today(),1),'Clear':()=>''};inp.value=map[v]();}
   else if(el.dataset.mode==='add'){const parts=inp.value.split(',').map(x=>x.trim()).filter(Boolean);if(!parts.some(x=>x.toLowerCase()===v.toLowerCase()))parts.push(v);inp.value=parts.join(', ')}
   else inp.value=v},
 topPeriod:el=>{S.topPeriod=el.dataset.v;render()},
 clearFilters:()=>{S.list={q:'',tier:'',tag:'',sort:S.list.sort,minRoll:''};render()},
 copy:async el=>{const v=el.dataset.v;try{await navigator.clipboard.writeText(v);toast('WeChat ID copied')}catch(e){const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('WeChat ID copied')}catch(_){toast(v)}ta.remove()}},
 loadExample:async()=>{if(S.data.patrons.some(p=>p.example)&&!await confirmDlg('Reload example patrons? Existing examples will be replaced; your real patrons are untouched.',{ok:'Reload',danger:false}))return;
   S.data.patrons=S.data.patrons.filter(p=>!p.example).concat(exampleData());persist();toast('Example data loaded');location.hash='#/';render()},
 clearExamples:async()=>{const n=S.data.patrons.filter(p=>p.example).length;if(!await confirmDlg(`Remove the ${n} example patrons? Your own patrons are kept.`,{ok:'Clear examples'}))return;
   S.data.patrons=S.data.patrons.filter(p=>!p.example);persist();toast('Examples cleared');render()},
 eraseAll:async()=>{if(!await confirmDlg(`Permanently erase <b>all ${S.data.patrons.length} patrons</b> from this browser? Export a backup first if unsure.`,{ok:'Erase everything',typeWord:'ERASE'}))return;
   S.data.patrons=[];persist();toast('All data erased');location.hash='#/';render()},
 exportJson:()=>exportJson(),exportCsv:()=>exportCsv(),exportActCsv:()=>exportActCsv(),
 import:()=>{const i=$('#importFile');i.value='';i.click()},
 setPin:()=>openSetPin(false),changePin:()=>openSetPin(true),removePin:()=>openRemovePin(),lockNow:()=>lockNow(),
 forgotPin:async()=>{const enc=S.meta.pin&&S.meta.pin.mode==='encrypt';
   if(!await confirmDlg(`${enc?'Your data is encrypted with the PIN and <b>cannot be recovered</b> without it.':'Without the PIN the app cannot be opened.'} You can erase everything and start fresh (then import a backup).`,{title:'Forgot PIN',ok:'Erase & reset',typeWord:'ERASE'}))return;
   [K.data,K.enc,K.meta].forEach(k=>localStorage.removeItem(k));S.meta=defaultMeta();saveMeta();S.data=emptyData();S.key=null;startApp();toast('Reset complete')}
};
async function delSub(el,arr,label){const p=pById(el);if(!p)return;if(!await confirmDlg(`Delete ${label}?`,{ok:'Delete'}))return;p[arr]=p[arr].filter(x=>x.id!==el.dataset.sub);touch(p);persist();toast('Deleted');render()}
document.addEventListener('click',e=>{const k=e.target.closest('#keypad [data-k]');if(k){const i=$('#pinInput');if(k.dataset.k==='del')i.value=i.value.slice(0,-1);else if(i.value.length<6)i.value+=k.dataset.k;$('#lockErr').textContent='';return}
  const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}});
document.addEventListener('keydown',e=>{S.lastActivity=Date.now();
  if(e.key==='Escape'&&$('#modalRoot').lastElementChild){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.prow[data-act]')){e.preventDefault();e.target.click()}});
$('#lockForm').addEventListener('submit',e=>{e.preventDefault();tryUnlock()});
$('#pinInput').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='q'){S.list.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;const L=S.list;
  if(id==='fTier'){L.tier=v;renderList()}else if(id==='fTag'){L.tag=v;renderList()}else if(id==='fRoll'){L.minRoll=v;renderList()}else if(id==='fSort'){L.sort=v;renderList()}
  else if(id==='sDispCur'){S.meta.settings.dispCur=v;saveMeta();toast('Totals shown in '+v)}
  else if(id==='sDefCur'){S.meta.settings.defCur=v;saveMeta()}
  else if(id==='sAutoLock'){S.meta.settings.autoLock=+v;saveMeta()}
  else if(id==='sRate'){const r=parseFloat(v);if(r>0.5&&r<2){S.meta.settings.hkdRate=r;saveMeta();toast('Rate saved')}else{toast('Enter a rate like 1.03',true);e.target.value=S.meta.settings.hkdRate}}
  else if(id==='importFile'){const fl=e.target.files[0];e.target.value='';importFile(fl)}});
['pointerdown','touchstart','scroll'].forEach(ev=>window.addEventListener(ev,()=>{S.lastActivity=Date.now()},{passive:true}));
const autoLockMs=()=>(+S.meta.settings.autoLock||0)*60e3;
setInterval(()=>{if(S.unlocked&&S.meta.pin&&autoLockMs()&&Date.now()-S.lastActivity>autoLockMs())lockNow()},10e3);
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.hiddenAt=Date.now()}else if(S.unlocked&&S.meta.pin&&autoLockMs()&&S.hiddenAt&&Date.now()-S.hiddenAt>autoLockMs())lockNow()});
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();render()}},60e3);
window.addEventListener('storage',async e=>{if(!S.unlocked)return;
  if(e.key===K.meta){const m=loadMeta();const changed=JSON.stringify(m.pin)!==JSON.stringify(S.meta.pin);S.meta=m;if(changed&&m.pin){lockNow();return}render();return}
  if(e.key===K.data&&!(S.meta.pin&&S.meta.pin.mode==='encrypt')&&e.newValue){S.data=loadPlain();render();toast('Updated from another tab')}
  if(e.key===K.enc&&S.meta.pin&&S.meta.pin.mode==='encrypt'&&e.newValue){try{const b=parseBlob(e.newValue);if(b.salt!==b64e(S.encInfo.salt)){lockNow();return}S.data=parseData(await decryptBlob(S.key,b));render();toast('Updated from another tab')}catch(_){lockNow()}}});

/* ============ Init ============ */
function init(){S.meta=loadMeta();
  if(S.meta.pin){if(!HAS_SUBTLE){showLock('This browser context cannot run the crypto needed to unlock. Open the file directly in Chrome/Safari.');return}showLock();return}
  S.data=loadPlain();cleanupStorage();startApp()}
init();
})();
</script>
